name: bench

on:
  push:
    branches: [main, handoff/linux-split]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Machine
        run: nproc; free -g; lscpu | grep -E "Model name|Thread|Core|Socket|Flags" | cut -c1-200

      - name: Build image
        run: docker build -t shopping-sessions:latest .

      - name: Build generator
        run: cd generator/generator && cargo build --release

      - name: Fixtures (in the container)
        run: |
          pip install -q polars
          chmod +x scripts/docker_run.sh
          CPUS=4 MEM=14g python3 scripts/run_fixtures.py fixtures -- scripts/docker_run.sh > /tmp/fx.txt 2>&1 || true
          tail -3 /tmp/fx.txt; echo "::notice title=fixtures::$(tail -1 /tmp/fx.txt)"

      - name: Generate datasets
        run: |
          G=generator/generator/target/release/generate
          $G --seed 1 --events 1000000 --clicks 250000 --output /tmp/dev
          $G --seed 7 --events 20000000 --clicks 5000000 --output /tmp/s20
          du -sh /tmp/dev /tmp/s20

      - name: Time runs (container, scorer flags, 4 CPUs)
        run: |
          note() { msg=$(awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}' "$2"); echo "::notice title=$1::$msg"; }
          run() {
            rm -rf /tmp/out && mkdir -p /tmp/out /tmp/scr && chmod 777 /tmp/out /tmp/scr
            /usr/bin/time -f "$1 wall %e s  maxrss %M KB" docker run --rm --network none --read-only \
              --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL --security-opt no-new-privileges \
              --cpus 4 --memory 14g --memory-swap 14g --user 1000:1000 \
              -v "$2":/data:ro -v /tmp/out:/output -v /tmp/scr:/scratch \
              -e DATA_DIR=/data -e OUTPUT_DIR=/output -e SCRATCH_DIR=/scratch -e HOME=/scratch \
              -e NCPU=${3:-4} -e MEM_GB=14 -e PIPE_VERBOSE=1 shopping-sessions:latest > /tmp/log.txt 2>&1
            cat /tmp/log.txt; note "$1" /tmp/log.txt
          }
          lscpu | grep -E "Model name|^CPU\(s\)|Thread" > /tmp/cpu.txt; note cpu /tmp/cpu.txt
          run dev /tmp/dev
          cat /tmp/s20/events/* > /dev/null
          for i in 1 2 3; do run s20 /tmp/s20; done
          run s20-nc8 /tmp/s20 8

      - name: Profile (native, perf)
        continue-on-error: true
        run: |
          note() { msg=$(awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}' "$2"); echo "::notice title=$1::$msg"; }
          cat /sys/kernel/mm/transparent_hugepage/enabled > /tmp/thp.txt; note thp /tmp/thp.txt
          sudo apt-get install -y -qq linux-tools-common linux-tools-$(uname -r) > /dev/null 2>&1 || sudo apt-get install -y -qq linux-tools-azure > /dev/null 2>&1 || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 >/dev/null
          CARGO_PROFILE_RELEASE_DEBUG=line-tables-only RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release
          rm -rf /tmp/o; NCPU=4 DATA_DIR=/tmp/s20 OUTPUT_DIR=/tmp/o PIPE_VERBOSE=1 perf record -F 2000 -g -o /tmp/perf.data target/release/pipeline 2> /tmp/plog.txt || true
          note native-run /tmp/plog.txt
          perf report -i /tmp/perf.data --no-children --stdio --sort srcline --percent-limit 0.7 -g none 2>/dev/null | grep -v "^#" | grep -v "^$" | head -60 > /tmp/prof.txt
          note profile /tmp/prof.txt
          perf report -i /tmp/perf.data --no-children --stdio --sort sym --percent-limit 0.5 -g none 2>/dev/null | grep -v "^#" | grep -v "^$" | head -40 > /tmp/prof2.txt
          note profile-sym /tmp/prof2.txt
          rm -rf /tmp/o; NCPU=4 DATA_DIR=/tmp/s20 OUTPUT_DIR=/tmp/o perf stat -e cycles,instructions,branches,branch-misses,cache-references,cache-misses,L1-dcache-load-misses,dTLB-load-misses,page-faults target/release/pipeline 2> /tmp/stat.txt || true
          note perf-stat /tmp/stat.txt
          S=$(perf report -i /tmp/perf.data --no-children --stdio --sort sym -g none 2>/dev/null | grep -v "^#" | grep "run_par<pipeline::main::P1" | head -1 | sed 's/.*\] //')
          perf annotate -i /tmp/perf.data --stdio -l "$S" 2>/dev/null | grep -E "^ +[0-9]+\.[0-9]+" | sort -rn | head -45 > /tmp/ann.txt || true
          note annotate-P1 /tmp/ann.txt
